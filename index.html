<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="초등학생을 위한 수학 게임 — 한국어 숫자 읽기, 각도 익히기, 쌓기나무 규칙 찾기.">
<title>수학 게임</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🧮</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">+</span>
      <div>
        <h1>수학 게임</h1>
        <p>초등학생을 위한 수학 연습 · 설치 없이 바로</p>
      </div>
    </div>
  </header>

  <ul class="game-list">
    <li>
      <a class="game-card" href="numbers.html">
        <span class="logo" aria-hidden="true">萬</span>
        <span class="game-text">
          <b>한국어 숫자 읽기</b>
          <span>조(兆) 단위까지 · 15000 → 1만 5000 → 만오천</span>
        </span>
        <span class="go" aria-hidden="true">→</span>
      </a>
    </li>
    <li>
      <a class="game-card" href="angles.html">
        <span class="logo logo-angle" aria-hidden="true">∠</span>
        <span class="game-text">
          <b>각도 익히기</b>
          <span>초등 3~4학년 · 예각과 둔각, 각도기 읽기와 각 그리기, 삼각형 세 각의 합</span>
        </span>
        <span class="go" aria-hidden="true">→</span>
      </a>
    </li>
    <li>
      <a class="game-card" href="stacks.html">
        <span class="logo logo-stack" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 9h10v10H4z" fill="#f3d6a4"/><path d="M4 9l5-4h10l-5 4z" fill="#fff3dc"/><path d="M14 9l5-4v10l-5 4z" fill="#d9a865"/></svg></span>
        <span class="game-text">
          <b>쌓기나무 규칙 찾기</b>
          <span>초등 4학년 · 1, 5, 14, 30, … 층별로 세어 식으로 쓰고 몇째 모양의 개수 구하기</span>
        </span>
        <span class="go" aria-hidden="true">→</span>
      </a>
    </li>
  </ul>

</div>
</body>
</html>
