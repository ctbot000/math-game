<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>math-game 테스트</title>
<style>
  body { font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 24px; background: #10131a; color: #d7dce5; }
  h1 { font-size: 18px; }
  h2 { font-size: 15px; margin: 22px 0 4px; }
  #summary { padding: 10px 14px; border-radius: 8px; font-weight: 700; margin: 16px 0; }
  #summary.ok { background: #123524; color: #6ee7a8; }
  #summary.bad { background: #3a1620; color: #ff8fa3; }
  li { list-style: none; padding: 2px 0; }
  .pass { color: #4f9d76; }
  .fail { color: #ff8fa3; }
  ul { padding-left: 0; margin: 0; }
</style>
</head>
<body>
<h1>math-game 테스트</h1>
<div id="summary">실행 중…</div>
<div id="suites"></div>

<script src="js/korean-number.js"></script>
<script src="js/korean-number.test.js"></script>
<script src="js/angle.js"></script>
<script src="js/angle.test.js"></script>
<script src="js/stack.js"></script>
<script src="js/stack.test.js"></script>
<script>
  var suites = [
    { name: 'korean-number.js', results: window.KOREAN_NUMBER_TEST_RESULTS || [] },
    { name: 'angle.js', results: window.ANGLE_TEST_RESULTS || [] },
    { name: 'stack.js', results: window.STACK_TEST_RESULTS || [] }
  ];
  var all = [].concat.apply([], suites.map(function (s) { return s.results; }));
  var failedCount = all.filter(function (r) { return !r.pass; }).length;
  var summary = document.getElementById('summary');
  summary.className = failedCount ? 'bad' : 'ok';
  summary.textContent = failedCount
    ? 'FAIL ' + failedCount + ' / ' + all.length
    : 'PASS ' + all.length + ' / ' + all.length;

  var box = document.getElementById('suites');
  suites.forEach(function (s) {
    var failed = s.results.filter(function (r) { return !r.pass; });
    var h = document.createElement('h2');
    h.textContent = s.name + ' — ' + (failed.length ? 'FAIL ' + failed.length : 'PASS') + ' / ' + s.results.length;
    box.appendChild(h);
    var list = document.createElement('ul');
    // 실패가 있으면 실패한 것만, 없으면 전체 목록.
    (failed.length ? failed : s.results).forEach(function (r) {
      var li = document.createElement('li');
      li.className = r.pass ? 'pass' : 'fail';
      li.textContent = (r.pass ? '✓ ' : '✗ ') + r.label +
        (r.pass ? ' = ' + r.actual : '  기대: ' + r.expected + '  실제: ' + r.actual);
      list.appendChild(li);
    });
    box.appendChild(list);
  });
  document.title = summary.textContent;
</script>
</body>
</html>
